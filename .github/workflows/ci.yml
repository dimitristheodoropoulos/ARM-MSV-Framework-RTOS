name: Embedded CI Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install ARM Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi qemu-system-arm

    - name: Build Firmware
      run: make clean && make

    - name: Verify ELF existence
      run: ls -l firmware.elf