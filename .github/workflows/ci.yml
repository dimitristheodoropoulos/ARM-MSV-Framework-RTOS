name: Embedded CI Build

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ARM Toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-none-eabi \
            qemu-system-arm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Clean Build
        run: make clean

      - name: Build Firmware
        run: make

      - name: Verify ELF
        run: |
          test -f firmware.elf
          arm-none-eabi-size firmware.elf

      - name: Run QEMU Integration Tests
        run: |
          pytest -q

      - name: Test Summary
        if: always()
        run: |
          echo "CI build and QEMU integration test stage completed."
